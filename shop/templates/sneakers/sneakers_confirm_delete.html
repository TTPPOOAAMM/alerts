{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление товара</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Вы уверены, что хотите удалить "{{ object }}"?</h1>
        <div class="card" style="max-width: 500px; margin-top: 20px;">
            <p>Это действие необратимо сотрет запись из базы данных магазина.</p>
            <form method="post">
                {% csrf_token %}
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-danger">Да, удалить навсегда</button>
                    <a href="{% url 'sneakers_list' %}" class="btn btn-secondary">Отмена (Вернуться)</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
