global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['sneaker_alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'django_shop'
    static_configs:
      - targets: ['web:8000']

  - job_name: 'arch_pc'
    static_configs:
      - targets: ['sneaker_node-exporter:9100']