global:
  resolve_timeout: 1m

route:
  receiver: 'local-webhook'
  group_by: ['category', 'alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: 'local-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/webhook'
        send_resolved: true